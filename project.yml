name: ActivityMonitorPlus
options:
  bundleIdPrefix: com.stevemurr
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Local MCP grants use the data-protection Keychain. A stable team
    # signature and team-derived access group keep those grants readable
    # across rebuilds.
    #
    # Use the paid Developer Program team, not the free personal team
    # (6237SR7A22). The personal team only issues 7-day provisioning
    # profiles, and once one expires AMFI refuses to launch the app at all
    # because of the restricted keychain-access-groups entitlement.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9AKW22W4WR
packages:
  LocalMCPKit:
    url: https://github.com/stevemurr/local-mcp-kit
    revision: a94a1923db95c9e1b6a4d381db956717e6cba01a
targets:
  ActivityMonitorPlus:
    type: application
    platform: macOS
    sources: [ActivityMonitorPlus]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ActivityMonitorPlus.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: LocalMCPKit
        product: LocalMCPContracts
      - package: LocalMCPKit
        product: LocalMCPDiscoveryBonjour
      - package: LocalMCPKit
        product: LocalMCPProducer
      # Hosted unit tests exercise a full in-process producer/consumer flow.
      # Link all test-used LocalMCP modules into the host app so the process
      # contains one copy of each module and cross-boundary error casts work.
      - package: LocalMCPKit
        product: LocalMCPConsumer
      - package: LocalMCPKit
        product: LocalMCPDiscovery
      - package: LocalMCPKit
        product: LocalMCPTesting
    info:
      path: ActivityMonitorPlus/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleDisplayName: Activity Monitor Plus
  ActivityMonitorPlusTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ActivityMonitorPlusTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ActivityMonitorPlus
  ActivityMonitorPlusUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [ActivityMonitorPlusUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ActivityMonitorPlus
schemes:
  ActivityMonitorPlus:
    build:
      targets:
        ActivityMonitorPlus: all
    run:
      config: Debug
    test:
      targets: [ActivityMonitorPlusTests]
  ActivityMonitorPlusUITests:
    build:
      targets:
        ActivityMonitorPlus: all
        ActivityMonitorPlusUITests: [test]
    test:
      targets: [ActivityMonitorPlusUITests]
